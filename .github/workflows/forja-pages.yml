name: Publicar Forja Fitness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar aplicativo
        run: node forja-fitness/tests/verify.cjs
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site/forja-fitness
          cp forja-fitness/index.html forja-fitness/config.js forja-fitness/manifest.json forja-fitness/sw.js forja-fitness/icon-192.png forja-fitness/icon-512.png forja-fitness/icon-maskable.png forja-fitness/apple-touch-icon.png _site/forja-fitness/
          cp pages-index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
